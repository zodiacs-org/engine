[workspace]
members = ["crates/core", "crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "MIT AND CC-BY-4.0"
publish = false

[workspace.dependencies]
zodiacs-rustcore = { path = "crates/core" }
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"

[profile.release]
lto = true
codegen-units = 1

