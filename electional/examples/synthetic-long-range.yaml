# Invented place and activity, with no natal input.
schemaVersion: electional/v1
activity: Synthetic long-range planetary-hour conditions
location:
  latitude: 0
  longitude: 0
range:
  start: 2000-01-01T00:00:00Z
  end: 2000-02-01T00:00:00Z
  clock: utc
houseSystem: whole
rules:
  - id: known-hour
    kind: planetary-hour
    mode: require
    options:
      rulers: [Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn]
      utcOffsetMinutes: 0
  - id: venus-hour
    kind: planetary-hour
    mode: prefer
    weight: 1
    options:
      rulers: [Venus]
      utcOffsetMinutes: 0
