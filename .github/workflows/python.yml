name: Python package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Python ${{ matrix.python }} / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', node: '20.19.0'}
          - {os: ubuntu-latest, python: '3.11', node: '22.7.0'}
          - {os: ubuntu-latest, python: '3.12', node: '22'}
          - {os: ubuntu-latest, python: '3.13', node: '24'}
          - {os: ubuntu-latest, python: '3.14', node: '24'}
          - {os: macos-latest, python: '3.11', node: '24'}
          - {os: windows-latest, python: '3.11', node: '24'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: python python/tools/verify_vendor.py
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build python
      - run: python -m twine check --strict python/dist/*
      - run: python -m pip install --no-deps python/dist/*.whl
      - run: python -m unittest discover -s python/tests -v
