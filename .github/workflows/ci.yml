name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  engine:
    name: Engine (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history: the archive check reads every commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The JSON report gives scripts/ratchet.mjs the count of passing tests.
      - name: Test
        run: npm run test:report

      - name: Build
        run: npm run build

      - name: Export smoke
        run: npm run exports:smoke

      # api/ holds each public entry point's declarations as the build gives
      # them (docs/versioning.md). A change to the public API fails here until
      # api/ is regenerated with npm run api:report and committed with it.
      - name: Public API matches api/
        run: npm run api:check

      - name: Package contents
        run: npm run package:contents

      # budgets.json (scripts/ratchet.mjs): the sizes, the accuracy and the
      # passing tests, measured on this build against their ceilings and
      # floors; and against the merge base with main, a loosened limit, a
      # changed guardrail file or a deleted test needs a commit in the range
      # with the approval tag and a person's Approved-by trailer. Started with
      # node, not npm run: the alias is in package.json, which is no guardrail
      # file, and this one is.
      - name: Ratchet
        run: node scripts/ratchet.mjs --check --tests .cache/vitest-report.json

      # No en or em dash in the documents scripts/verify-no-dashes.mjs names.
      - name: No en or em dashes
        run: npm run dashes:check

      # tools/wheel (@zodiacs/wheel), which needs no build: wheel geometry,
      # text, validation, XML and escaping, require() of both entries and the
      # npm pack file list. accessible-wheel.yml runs its clean consumers.
      - name: Wheel selftest
        run: node tools/wheel/selftest.mjs

      - name: Pack dry run
        run: npm run pack:dry-run

      # A version string names one byte sequence. The check reads git objects
      # only: artifacts/ must be a real directory in every commit, the manifest
      # append-only, every version strict, every archive and receipt its
      # recorded bytes in every commit, each archive's packed metadata its
      # source commit's, and when HEAD's version has a carried archive, HEAD's
      # tree, written from git objects and installed by its own npm ci, must
      # rebuild it (reported as a skip before that archive is committed).
      # Started with node, not npm run, which reads the checkout's .npmrc first.
      - name: Carried archives match history and source
        run: node scripts/verify-archive-binding.mjs

  de440-tier-b:
    # docs/de440.md, Checks: the DE440 reduction on NAIF's de440.bsp against
    # the ERFA chain's places and nodes (src/de440-kernel.test.ts). The kernel
    # is fetched from NAIF, checked by its SHA-256 and cached by it; it is
    # never uploaded as an artifact. A failed download is not a failure of the
    # engine: re-run the job.
    name: DE440 on the kernel (tier B)
    runs-on: ubuntu-latest
    env:
      KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440.bsp
      KERNEL_SHA256: a4ce9bf9b3282becc9f4b2ac3cebe03a2ae7599981aabd7265fd8482fff7c4b5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore the kernel
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kernels/de440.bsp
          key: de440-bsp-a4ce9bf9b3282becc9f4b2ac3cebe03a2ae7599981aabd7265fd8482fff7c4b5

      - name: Fetch the kernel from NAIF
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/kernels"
          curl -sS --fail --retry 4 --retry-delay 15 -o "$RUNNER_TEMP/kernels/de440.bsp" "$KERNEL_URL"

      - name: Check the kernel's digest
        run: echo "$KERNEL_SHA256  $RUNNER_TEMP/kernels/de440.bsp" | sha256sum -c -

      - name: Save the kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kernels/de440.bsp
          key: de440-bsp-a4ce9bf9b3282becc9f4b2ac3cebe03a2ae7599981aabd7265fd8482fff7c4b5

      - name: Tier B
        # A skipped test fails the job: every tier-B test must run here.
        run: |
          PRECISION_KERNEL="$RUNNER_TEMP/kernels/de440.bsp" npx vitest run src/de440-kernel.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/tier-b.json"
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (r.numPendingTests + r.numTodoTests > 0 || r.numPassedTests !== r.numTotalTests || r.numTotalTests < 3) { console.error("tier B: " + JSON.stringify({ total: r.numTotalTests, passed: r.numPassedTests, skipped: r.numPendingTests })); process.exit(1); } console.log("tier B: " + r.numPassedTests + " of " + r.numTotalTests + " passed, none skipped");' "$RUNNER_TEMP/tier-b.json"

  archives:
    name: Every carried archive rebuilds from its source commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Everything the default check does, including the rebuild of HEAD, and
      # a rebuild of every recorded archive from its source commit.
      - name: Rebuild every recorded archive
        run: node scripts/verify-archive-binding.mjs --rebuild-all

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and pack
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"

      - name: Keep the packed archive
        uses: actions/upload-artifact@v4
        with:
          name: packed-engine
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  consumer:
    # The same packed bytes, installed by a clean consumer on each supported
    # runtime, including the two minimum versions: plain Node loads
    # astronomy-engine's ESM only from 20.19.0 and 22.7.0, and from 3.0.0
    # require() loads the package's ES modules only from 20.19.0 and 22.12.0.
    name: Packed consumer (Node ${{ matrix.node }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.12.0', 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Fetch the packed archive
        uses: actions/download-artifact@v4
        with:
          name: packed-engine
          path: ${{ runner.temp }}/pack

      - name: Install and exercise it in a clean consumer
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/verify-packed-consumer.mjs "$(ls "$RUNNER_TEMP"/pack/*.tgz)"
