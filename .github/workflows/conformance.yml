name: Conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The zone vectors read the host's Intl time zone data, so the Node
      # version (and with it ICU and tzdata) is pinned to the one the
      # committed results were made with.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Harness self-test
        run: node --test conformance/harness/selftest.mjs

      - name: Vectors conform to SPEC.md
        run: node conformance/harness/validate.mjs --expect-total 640

      - name: This engine's verdicts match the committed results
        run: node conformance/harness/run.mjs --adapter "node conformance/adapters/zodiacs-engine.mjs" --check conformance/results/zodiacs-engine.json

      - name: The verdicts of the engine on astronomy-engine, its fallback, match the committed results
        run: node conformance/harness/run.mjs --adapter "node conformance/adapters/zodiacs-engine.mjs --ephemeris astronomy-engine" --check conformance/results/zodiacs-engine-astronomy-engine.json

      - name: RESULTS.md and summary.json are current
        run: node conformance/harness/report.mjs --check

  generators:
    name: Conformance vectors rebuild from their sources
    runs-on: ubuntu-latest
    # L4 solves its events on NAIF's de440s.bsp, fetched from NAIF, checked by
    # its SHA-256 and cached by it, as the tier-B job in ci.yml does with
    # de440.bsp; it is never committed or uploaded. A failed download is not
    # a failure of the vectors: re-run the job.
    env:
      KERNEL_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
      KERNEL_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The versions the committed vector files were generated with.
      - name: Install the arbiters' libraries
        run: python -m pip install pyerfa==2.0.1.5 numpy==2.4.6 jplephem==2.24

      - name: L1 positions
        run: python conformance/arbiters/l1/build.py

      - name: L2 houses and angles
        run: python conformance/arbiters/l2/build.py

      # Downloads tzdata and tzcode 2025c from IANA and checks their digests.
      - name: L3 time and calendars
        run: python conformance/arbiters/l3/build.py

      - name: L4 sources match their recorded digests
        run: python conformance/arbiters/l4/build.py --verify-sources

      - name: L4 generator self-test
        run: python conformance/arbiters/l4/test_build.py

      - name: Restore the kernel
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kernels/de440s.bsp
          key: de440s-bsp-c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2

      - name: Fetch the kernel from NAIF
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/kernels"
          curl -sS --fail --retry 4 --retry-delay 15 -o "$RUNNER_TEMP/kernels/de440s.bsp" "$KERNEL_URL"

      - name: Check the kernel's digest
        run: echo "$KERNEL_SHA256  $RUNNER_TEMP/kernels/de440s.bsp" | sha256sum -c -

      - name: Save the kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kernels/de440s.bsp
          key: de440s-bsp-c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2

      # Rebuilds L4-events.json and its recorded solutions in memory, about
      # five minutes, and compares them byte for byte with the committed files.
      - name: L4 event times
        run: python conformance/arbiters/l4/build.py --kernel "$RUNNER_TEMP/kernels/de440s.bsp" --check

      - name: The rebuilt files are byte-identical to the committed ones
        run: |
          git diff --exit-code -- conformance/vectors
          test -z "$(git status --porcelain -- conformance/vectors)"
