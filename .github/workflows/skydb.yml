name: SkyDB

on:
  push:
    branches: [main]
    paths: ['skydb/**', '.github/workflows/skydb.yml']
  pull_request:
    branches: [main]
    paths: ['skydb/**', '.github/workflows/skydb.yml']

permissions:
  contents: read

jobs:
  skydb:
    name: SkyDB (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skydb
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'

      - name: Verify archive and install locked project dependencies
        run: npm run setup

      # SkyDB is JavaScript tooling with no typecheck or build script.
      - name: Check module syntax
        run: |
          for file in src/*.mjs scripts/*.mjs benchmarks/*.mjs test/*.node-test.mjs; do
            node --check "$file"
          done

      - name: Check project safety and package exclusion
        env:
          SKYDB_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-project.mjs

      - name: Run Node test-runner suites
        run: npm test
