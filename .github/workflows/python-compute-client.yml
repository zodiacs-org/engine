name: Python Compute client
on:
  pull_request:
    paths:
      - 'clients/python/**'
      - 'clients/typescript/contracts/**'
      - '.github/workflows/python-compute-client.yml'
permissions:
  contents: read
jobs:
  client:
    name: Python ${{ matrix.python }} source and fresh wheel consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          sparse-checkout: |
            clients/python
            clients/typescript/contracts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated client and checking dependencies
        run: python -m pip install httpx==0.28.1 mypy==1.19.1 build==1.3.0
      - name: Verify derived contract digest and generated types
        run: node clients/python/scripts/generate-contract.mjs --check
      - name: Strict source declarations and negative consumer controls
        working-directory: clients/python
        env:
          PYTHONPATH: src
        run: |
          python -m mypy --strict src
          python checks/types_check.py
      - name: Execute source transport and contract checks
        working-directory: clients/python
        env:
          PYTHONPATH: src
          CLIENT_MODE: source
          CLIENT_REPORT: evidence/python-${{ matrix.python }}-source.json
          PROGRAMME_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p evidence
          python checks/run.py
      - name: Build private wheel and sdist; install in a fresh outside-checkout consumer
        env:
          PROGRAMME_HEAD: ${{ github.event.pull_request.head.sha }}
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python clients/python/scripts/verify-consumer.py
      - name: Export actual runner reports for review
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const root = 'clients/python/evidence';
          for (const file of readdirSync(root).filter(name=>name.endsWith('.json') && name.startsWith('python-${{ matrix.python }}-')).sort()) {
            const path = root+'/'+file;const bytes=readFileSync(path);
            console.log('PROGRAMME_FILE '+JSON.stringify({path,size:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex'),base64:bytes.toString('base64')}));
          }
          NODE
